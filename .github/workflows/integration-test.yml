name: Integration Tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      run-integration:
        description: 'Run integration tests'
        required: true
        default: 'true'
        type: boolean

jobs:
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.run-integration == 'true'
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Start test containers
        run: |
          docker compose -f docker-compose.test.yml up -d
          # Wait for Chrome to be ready
          timeout 120 bash -c 'until curl -s http://localhost:9222/json/version > /dev/null; do sleep 2; done'

      - name: Run integration tests
        run: |
          go test -v -tags=integration ./internal/integration/... -timeout 10m
        env:
          CHROME_ENDPOINT: ws://localhost:9222/devtools/browser

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v